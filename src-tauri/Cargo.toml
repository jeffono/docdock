[package]
name = "docdock"
version = "0.1.0-beta.3"
description = "Autohide sidebar for viewing, adding, and editing references"
authors = ["Jeff Ono"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "docdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.7.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
notify = { version = "8", default-features = false }
# Without `single-thread` the engine is Send + Sync: built off the UI thread, matched on it.
adblock = { version = "0.13.5", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Unoptimized, the engine took about 10 ms per request on the WebView2 UI thread in `tauri dev`;
# optimized, about 0.3 ms. Release builds are optimized anyway.
[profile.dev.package.adblock]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.flatbuffers]
opt-level = 3
[profile.dev.package.idna]
opt-level = 3
[profile.dev.package.psl]
opt-level = 3
[profile.dev.package.seahash]
opt-level = 3
