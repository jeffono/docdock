name: Release

# Manual only: publishing the draft creates the tag, which must not start a second build.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($version -ne $packageVersion -or $version -ne $cargoVersion) {
            throw 'Package, Cargo and Tauri versions must match'
          }
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > $null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock is out of date' }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: DocDock __VERSION__ (preliminary beta)
          releaseBody: |
            Preliminary beta for Windows. Back up your notes before testing.
            The installer is unsigned: Windows SmartScreen may show an unknown publisher warning.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          tauriScript: pnpm tauri
